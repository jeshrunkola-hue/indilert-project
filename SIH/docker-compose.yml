services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_safe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nersafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nersafepass}
      POSTGRES_DB: ${POSTGRES_DB:-nersafe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nersafe -d nersafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ner_safe_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nersafe:nersafepass@db:5432/nersafe_db
      SECRET_KEY: ${SECRET_KEY:-ner-safe-disaster-resilience-key-2026-secret-jwt}
      UPLOAD_DIR: uploads
      DEMO_MODE_ACTIVE: "true"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: ner_safe_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
