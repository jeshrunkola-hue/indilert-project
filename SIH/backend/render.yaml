services:
  - type: web
    name: indilert-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./ner_safe.db
      - key: CORS_ORIGINS
        value: "https://your-admin.netlify.app,https://your-citizen.netlify.app,http://localhost:5174,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
